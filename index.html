<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Tidak Dapat Digunakan</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
        }
        /* Menggunakan flexbox pada body untuk memposisikan footer di paling bawah */
        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
            box-sizing: border-box;
        }
        h1 {
            font-size: 48px;
            color: #e74c3c;
            margin-top: 0;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        /* Style untuk bagian footer */
        footer {
            width: 100%;
            text-align: center;
            padding: 20px 0;
            background-color: #ffffff;
            color: #888;
            font-size: 14px;
            border-top: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>

    <!-- Konten Utama (Pesan Error) -->
    <div class="main-content">
        <div class="container">
            <h1>Maaf</h1>
            <p>Website ini sudah tidak dapat digunakan.</p>
            <a href="https://linktr.ee/guinshop" class="btn">klik disini untuk ke website Guin Shop</a>
        </div>
    </div>

    <!-- Footer Shine Shop -->
    <footer>
        &copy; 2026 Shine Shop. Hak Cipta Dilindungi.
    </footer>

</body>
</html>
